# 高频整句。匹配时忽略标点和空格。
# zh: 中文说法列表，第一个是反向翻译时的标准译法。
# duck: 鸭语；同一句鸭语只能出现在一个条目里。gloss 由词典自动生成。
- zh: [你好, 您好, 你好吗, 你还好吗, 嗨, 哈喽]
  duck: wa wi ki?
  emotion: question
- zh: [谢谢, 谢谢你, 多谢]
  duck: wa wi
  emotion: soft
- zh: [再见, 拜拜]
  duck: ka wiiko
  emotion: neutral
- zh: [对不起, 抱歉]
  duck: ka ko wi
  emotion: soft
- zh: [没关系, 没事]
  duck: ko kaakaa
  emotion: soft
- zh: [早上好, 早安]
  duck: kowii wiki
  emotion: soft
- zh: [晚安, 睡个好觉]
  duck: wookaa wi
  emotion: soft
- zh: [救命, 救命啊]
  duck: kaakaa kaakaa!
  emotion: alarm
- zh: [我饿了, 我饿, 我好饿]
  duck: ka wakaa kii
  emotion: neutral
- zh: [我渴了, 我渴]
  duck: ka waa kii
  emotion: neutral
- zh: [我累了, 我困了]
  duck: ka woo kii
  emotion: neutral
- zh: [我喜欢你, 我爱你]
  duck: ka wa wiwa
  emotion: soft
- zh: [为什么, 为什么呀]
  duck: kiwa ki?
  emotion: question
- zh: [是, 是的, 对, 嗯]
  duck: kowi
  emotion: neutral
- zh: [不是, 不对]
  duck: ko kowi
  emotion: neutral
- zh: [好的, 好, 可以]
  duck: wi
  emotion: soft
