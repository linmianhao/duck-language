# 嘎语核心词典
# duck: 鸭语写法；gloss: 中文释义；pos: 词性；frame: 可选语义角色
# pos 取值：pron / n / v / stative / q / num / quant / neg / particle / aspect / postp / interj

# 代词
- duck: ma
  gloss: [我, 自己, 本人]
  pos: pron
- duck: na
  gloss: [你, 您]
  pos: pron
- duck: ta
  gloss: [他, 她, 它, 那, 那个]
  pos: pron
- duck: ti
  gloss: [这, 这个, 这里, 这儿]
  pos: pron
- duck: mama
  gloss: [我们, 咱们]
  pos: pron
- duck: nana
  gloss: [你们]
  pos: pron
- duck: tata
  gloss: [他们, 她们, 它们]
  pos: pron

