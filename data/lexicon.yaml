# 嘎语核心词典（v2，双向唯一）
#
# duck : 鸭语写法。音节 = 声母(k 亮 / w 暗) + 韵母(a 降 / i 升 / o 平)，长音双写元音。
#        多个词组成的短语用空格分隔（例如 "wakaa kii" = 饿）。
# gloss: 中文释义。第一个是反向翻译时的标准译法；同一个中文词只能出现在一个条目里。
# pos  : pron / n / v / stative / q / neg / particle / aspect / fut / postp / conj / time
# animate: 名词能否作动作主语（反向翻译时决定单个名词是主语还是宾语）
# pred : 名词单独作谓语时的中文（例如 雨 -> 下雨）
# place: 名词作处所时的中文（例如 水 -> 水边）
# placeholder: 未收录词的占位词

# 代词
- duck: ka
  gloss: [我, 自己]
  pos: pron
- duck: wa
  gloss: [你, 您]
  pos: pron
- duck: kowa
  gloss: [他, 她, 它]
  pos: pron
- duck: kaka
  gloss: [我们, 咱们]
  pos: pron
- duck: wawa
  gloss: [你们]
  pos: pron
- duck: kowa kowa
  gloss: [他们, 她们, 它们]
  pos: pron
- duck: wo
  gloss: [这, 这里, 这个, 这儿]
  pos: pron
- duck: wiwo
  gloss: [那, 那里, 那个, 那儿]
  pos: pron

# 功能词
